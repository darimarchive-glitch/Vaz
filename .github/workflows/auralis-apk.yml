name: Auralis APK

on:
  push:
    branches:
      - ci-auralis-apk-20260920
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Restore and patch Auralis source
        shell: bash
        run: |
          base64 -d .auralis/auralis.zip.b64 > /tmp/auralis.zip
          cd /tmp
          unzip -q auralis.zip
          cd /tmp/auralis-reader-1.0.0
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pubspec.yaml')
          p.write_text(p.read_text().replace('  adwaita_gtk: ^1.2.0\n', ''))
          Path('lib/app.dart').write_text("""import 'package:flutter/material.dart';

          import 'controllers/app_controller.dart';
          import 'ui/library_page.dart';

          class AuralisApp extends StatelessWidget {
            const AuralisApp({super.key, required this.controller});
            final AppController controller;

            ThemeData _theme(Brightness brightness) {
              final scheme = ColorScheme.fromSeed(
                seedColor: const Color(0xFF3584E4),
                brightness: brightness,
              );
              return ThemeData(
                useMaterial3: true,
                brightness: brightness,
                colorScheme: scheme,
                scaffoldBackgroundColor: brightness == Brightness.light
                    ? const Color(0xFFF6F5F4)
                    : const Color(0xFF1E1E1E),
                appBarTheme: AppBarTheme(
                  centerTitle: false,
                  elevation: 0,
                  backgroundColor: brightness == Brightness.light
                      ? const Color(0xFFF6F5F4)
                      : const Color(0xFF1E1E1E),
                ),
                inputDecorationTheme: InputDecorationTheme(
                  filled: true,
                  border: OutlineInputBorder(
                    borderRadius: BorderRadius.all(Radius.circular(12)),
                    borderSide: BorderSide.none,
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return AnimatedBuilder(
                animation: controller,
                builder: (context, _) => MaterialApp(
                  title: 'Auralis Reader',
                  debugShowCheckedModeBanner: false,
                  theme: _theme(Brightness.light),
                  darkTheme: _theme(Brightness.dark),
                  themeMode: controller.settings.themeMode,
                  home: LibraryPage(controller: controller),
                ),
              );
            }
          }
          """)
          PY

      - name: Generate Android runner
        shell: bash
        run: |
          cd /tmp/auralis-reader-1.0.0
          python3 tool/bootstrap.py

      - name: Analyze
        shell: bash
        run: |
          cd /tmp/auralis-reader-1.0.0
          flutter analyze

      - name: Build release APK
        shell: bash
        run: |
          cd /tmp/auralis-reader-1.0.0
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/Auralis-Reader-1.0.0.apk"

      - name: Validate APK archive
        shell: bash
        run: |
          unzip -t Auralis-Reader-1.0.0.apk >/dev/null
          sha256sum Auralis-Reader-1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auralis-reader-1.0.0-apk
          path: Auralis-Reader-1.0.0.apk
          if-no-files-found: error
          retention-days: 1
